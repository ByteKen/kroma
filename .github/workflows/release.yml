name: Release Desktop Binaries

on:
  push:
    # Only trigger on semver desktop release tags (ignores auxiliary tags like models-v1)
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0; must match workspace version)"
        required: true
        type: string
      draft:
        description: "Publish as draft GitHub Release"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Pre-Release Quality Gates
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      is_draft: ${{ steps.meta.outputs.is_draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq "workflow_dispatch") { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Invalid release tag '$tag'. Expected format vX.Y.Z or vX.Y.Z-rc.1."
            exit 1
          }
          $version = $tag.Substring(1)
          $isPrerelease = if ($version -match '-') { "true" } else { "false" }
          $isDraft = if ($env:EVENT_NAME -eq "workflow_dispatch") { $env:INPUT_DRAFT } else { "false" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "is_draft=$isDraft" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kroma-web/package-lock.json

      - name: Validate versions, CHANGELOG.md, models.json, and git hygiene
        shell: pwsh
        env:
          EXPECTED_TAG: ${{ steps.meta.outputs.tag }}
        run: node scripts/release-check.mjs --all --expected-tag "$env:EXPECTED_TAG"

      - name: Install frontend dependencies
        run: npm --prefix kroma-web ci

      - name: Frontend typecheck & unit tests
        run: |
          npm --prefix kroma-web run typecheck
          npm --prefix kroma-web test

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Rust workspace tests & Clippy lints (Windows)
        run: |
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings

  build-windows:
    name: Build Windows Installers (NSIS & MSI)
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kroma-web/package-lock.json

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm --prefix kroma-web ci

      - name: Build Kroma Desktop Windows installers
        run: npm --prefix kroma-web run tauri:build

      - name: Stage Windows installers & portable archive
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $ver = $env:VERSION
          $outDir = "release-artifacts"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $nsis = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msi = Get-ChildItem -Path "target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $nsis -and -not $msi) {
            Write-Error "No Windows installer bundles (.exe/.msi) were produced under target/release/bundle/."
            exit 1
          }

          if ($nsis) {
            $destExe = Join-Path $outDir "Kroma-${ver}_Windows_x64-setup.exe"
            Copy-Item -Path $nsis.FullName -Destination $destExe -Force
            Write-Host "Staged $(Split-Path $destExe -Leaf) ($((Get-Item $destExe).Length) bytes)"
          }

          if ($msi) {
            $destMsi = Join-Path $outDir "Kroma-${ver}_Windows_x64.msi"
            Copy-Item -Path $msi.FullName -Destination $destMsi -Force
            Write-Host "Staged $(Split-Path $destMsi -Leaf) ($((Get-Item $destMsi).Length) bytes)"
          }

          $binPath = "target/release/kroma-desktop.exe"
          if (-not (Test-Path $binPath)) {
            Write-Error "Missing portable binary at $binPath"
            exit 1
          }
          $portableStage = "portable-stage/Kroma-${ver}_Windows_x86_64"
          New-Item -ItemType Directory -Force -Path $portableStage | Out-Null
          Copy-Item -Path $binPath -Destination (Join-Path $portableStage "Kroma.exe") -Force
          Get-ChildItem -Path "target/release" -Filter "*.dll" -File -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination (Join-Path $portableStage $_.Name) -Force
          }
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination $portableStage -Force }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination $portableStage -Force }

          $destZip = Join-Path $outDir "Kroma-${ver}_Windows_x86_64.zip"
          Compress-Archive -Path "$portableStage/*" -DestinationPath $destZip -Force
          Write-Host "Staged $(Split-Path $destZip -Leaf) ($((Get-Item $destZip).Length) bytes)"

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kroma-windows-x64
          path: release-artifacts/*
          retention-days: 14
          if-no-files-found: error

  build-macos:
    name: Build macOS Installers & Portable Archives (Apple Silicon arm64)
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kroma-web/package-lock.json

      - name: Install Rust stable toolchain & Apple Silicon target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-aarch64

      - name: Install frontend dependencies
        run: npm --prefix kroma-web ci

      - name: Run Rust tests on Apple Silicon host
        run: cargo test --workspace

      - name: Build Kroma Desktop macOS App & DMG (aarch64-apple-darwin)
        run: npm --prefix kroma-web run tauri:build -- --target aarch64-apple-darwin --bundles app,dmg

      - name: Stage macOS DMG, ZIP, and TAR.GZ archives
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p release-artifacts
          shopt -s nullglob
          dmgs=(target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "Error: No macOS .dmg bundle produced under target/aarch64-apple-darwin/release/bundle/dmg/." >&2
            exit 1
          fi
          cp "${dmgs[0]}" "release-artifacts/Kroma-${VERSION}_MacOS_arm64.dmg"

          app_bundle="target/aarch64-apple-darwin/release/bundle/macos/Kroma.app"
          if [ -d "$app_bundle" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$app_bundle" "release-artifacts/Kroma-${VERSION}_MacOS_arm64.zip"
            tar -czf "release-artifacts/Kroma-${VERSION}_MacOS_arm64.tar.gz" -C "target/aarch64-apple-darwin/release/bundle/macos" "Kroma.app"
          fi
          ls -lh release-artifacts/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kroma-macos-aarch64
          path: release-artifacts/*
          retention-days: 14
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [verify, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract Markdown release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node scripts/release-check.mjs --extract-changelog "$VERSION" > release-notes.md
          cat <<EOF >> release-notes.md

          ---

          ### Downloads by Operating System

          | Operating System | Format | File |
          | :--- | :--- | :--- |
          | **Windows (64-bit \`x86_64\`)** | Setup Installer (Recommended) | \`Kroma-${VERSION}_Windows_x64-setup.exe\` |
          | **Windows (64-bit \`x86_64\`)** | MSI Installer | \`Kroma-${VERSION}_Windows_x64.msi\` |
          | **Windows (64-bit \`x86_64\`)** | Portable ZIP (No install required) | \`Kroma-${VERSION}_Windows_x86_64.zip\` |
          | **macOS (Apple Silicon \`arm64\`)** | Disk Image Installer (Recommended) | \`Kroma-${VERSION}_MacOS_arm64.dmg\` |
          | **macOS (Apple Silicon \`arm64\`)** | Portable App Bundle (\`.zip\`) | \`Kroma-${VERSION}_MacOS_arm64.zip\` |
          | **macOS (Apple Silicon \`arm64\`)** | Portable App Bundle (\`.tar.gz\`) | \`Kroma-${VERSION}_MacOS_arm64.tar.gz\` |
          EOF
          cat release-notes.md

      - name: Download all platform installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        shell: bash
        run: |
          cd release-artifacts
          sha256sum *.exe *.msi *.dmg *.zip *.tar.gz | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: Kroma ${{ needs.verify.outputs.tag }}
          body_path: release-notes.md
          draft: ${{ needs.verify.outputs.is_draft == 'true' }}
          prerelease: ${{ needs.verify.outputs.is_prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.exe
            release-artifacts/*.msi
            release-artifacts/*.dmg
            release-artifacts/*.zip
            release-artifacts/*.tar.gz
            release-artifacts/SHA256SUMS.txt
            CHANGELOG.md
