<!doctype html>
<html class="dark" lang="en" style="height: 100%; background-color: #111214; margin: 0; padding: 0">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>Kroma — AI Darkroom &amp; Batch Develop Studio</title>
</head>

<body class="bg-canvas text-ink-primary font-body antialiased select-none overflow-hidden"
  style="height: 100%; margin: 0; padding: 0; background-color: #111214; color: #f3f4f6; overflow: hidden">
  <div id="boot-splash" role="status" aria-label="Loading Kroma"
    style="position: fixed; inset: 0; z-index: 125; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; overflow: hidden; padding: 0 24px; background: radial-gradient(ellipse 80% 62% at 50% 34%, #1e1c1a 0%, #141519 46%, #0b0c0f 100%)">
    <div aria-hidden="true"
      style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle 540px at 50% 38%, rgba(245, 158, 11, 0.11), transparent 68%), radial-gradient(circle 480px at 66% 70%, rgba(16, 185, 129, 0.08), transparent 70%)">
    </div>
    <div aria-hidden="true"
      style="position: absolute; width: 360px; height: 360px; border-radius: 9999px; opacity: 0.55; filter: blur(76px); pointer-events: none; background: radial-gradient(circle, rgba(245, 158, 11, 0.22) 0%, rgba(16, 185, 129, 0.11) 46%, transparent 72%)">
    </div>
    <div style="position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center">
      <div
        style="width: 108px; height: 108px; border-radius: 28px; background: linear-gradient(180deg, #20232a 0%, #17191f 50%, #111317 100%); border: 1px solid rgba(255, 255, 255, 0.11); box-shadow: 0 22px 48px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(245, 158, 11, 0.14); overflow: hidden; display: flex; align-items: center; justify-content: center">
        <img src="/kroma-logo.png" alt="Kroma" draggable="false"
          style="width: 106%; height: 106%; max-width: none; object-fit: cover; display: block; pointer-events: none" />
      </div>
      <div
        style="margin-top: 28px; min-height: 20px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; font-size: 11.5px; letter-spacing: 0.04em; color: #9ca3af">
        Starting Kroma…
      </div>
      <div aria-hidden="true"
        style="margin-top: 12px; width: 224px; height: 3px; border-radius: 9999px; background: rgba(255, 255, 255, 0.08); overflow: hidden">
        <div
          style="width: 12%; height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #f59e0b 0%, #ffc174 50%, #f59e0b 100%)">
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      function reveal() {
        var internals = window.__TAURI_INTERNALS__;
        if (internals && typeof internals.invoke === 'function') {
          internals.invoke('reveal_main_window').catch(function () { });
        }
      }
      requestAnimationFrame(function () {
        requestAnimationFrame(reveal);
      });
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
